[package]
name = "rh-zero-multi-brane"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Formal F1-square multi-brane geometry and combinatorial bounds"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UOR-Foundation/PrismPM"
homepage = "https://github.com/UOR-Foundation/PrismPM"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "generation-manifest.json"]

[features]
default = ["std"]
std = []

[dependencies]

[lib]
path = "src/lib.rs"
